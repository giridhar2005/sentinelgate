version: "3.9"

# ==============================================================================
# All-in-One Local Offline Stack: SentinelGate + Ollama
# Zero cloud API keys required. 100% private in-process caching & inference.
# Run with: docker compose -f docker-compose.ollama.yml up -d
# ==============================================================================

services:
  ollama:
    image: ollama/ollama:latest
    container_name: sentinelgate-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=24h
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    image: sentinelgate:latest
    container_name: sentinelgate-gateway
    restart: unless-stopped
    depends_on:
      ollama:
        condition: service_started
    ports:
      - "8000:8000"
    environment:
      - SENTINELGATE_CONFIG=/app/config.yaml
      - SENTINELGATE_DB=/app/data/sentinelgate.db
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - sentinelgate_data:/app/data
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 3s
      start_period: 5s
      retries: 3

volumes:
  sentinelgate_data:
    driver: local
  ollama_models:
    driver: local
