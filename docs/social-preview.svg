<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Dark obsidian gradient -->
    <linearGradient id="socialBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="40%" stop-color="#0D0D11" />
      <stop offset="100%" stop-color="#121217" />
    </linearGradient>

    <!-- Subtle engineering grid -->
    <pattern id="socialGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#16161A" stroke-width="0.8" />
    </pattern>

    <!-- Emerald Glow -->
    <radialGradient id="emeraldGlow" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#socialBg)" />
  <rect width="1280" height="640" fill="url(#emeraldGlow)" />
  <rect width="1280" height="640" fill="url(#socialGrid)" />

  <!-- Outer Hairline Border -->
  <rect x="0.5" y="0.5" width="1279" height="639" fill="none" stroke="#27272A" stroke-width="1.2" />

  <!-- Top Accent Pill -->
  <g transform="translate(80, 72)">
    <rect x="0" y="0" width="310" height="30" rx="15" fill="#141418" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.4" />
    <circle cx="15" cy="15" r="4.5" fill="#10B981" />
    <text x="28" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="11" font-weight="600" fill="#34D399" letter-spacing="0.5">0-DEPENDENCY AI &amp; AGENT FIREWALL</text>
  </g>

  <!-- Main Brand Title + Logo Monogram -->
  <g transform="translate(80, 142)">
    <!-- Monogram Shield -->
    <rect x="0" y="0" width="76" height="76" rx="16" fill="#141418" stroke="#27272A" stroke-width="1.8" />
    <path d="M 38 18 L 22 25 V 40 C 22 50 30 58 38 61 C 46 58 54 50 54 40 V 25 Z" fill="none" stroke="#FAFAFA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 31 39 L 36 44 L 46 34" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Wordmark & Version -->
    <text x="96" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-size="58" font-weight="800" fill="#FFFFFF" letter-spacing="-1.5">SentinelGate</text>
    <rect x="496" y="24" width="62" height="24" rx="5" fill="#18181C" stroke="#27272A" stroke-width="1" />
    <text x="527" y="40" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="600" fill="#10B981">v0.5.0</text>
  </g>

  <!-- Tagline Value Prop -->
  <g transform="translate(80, 260)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="24" font-weight="500" fill="#E4E4E7" letter-spacing="-0.3">
      Zero-bloat, production LLM gateway backed by in-process SQLite WAL.
    </text>
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16.5" font-weight="400" fill="#71717A">
      Semantic vector cache &middot; Pre-execution agent firewall &middot; Stream secret redactor &middot; 0 External Daemons
    </text>
  </g>

  <!-- 4 Architecture Spec Cards -->
  <g transform="translate(80, 360)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="260" height="116" rx="10" fill="#111114" stroke="#27272A" stroke-width="1" />
      <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#71717A" letter-spacing="0.5">OVERHEAD</text>
      <text x="20" y="68" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#10B981">&lt;0.5 ms</text>
      <text x="20" y="92" font-family="-apple-system, sans-serif" font-size="11" fill="#A1A1AA">Zero network hops (mmap)</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(286, 0)">
      <rect width="260" height="116" rx="10" fill="#111114" stroke="#27272A" stroke-width="1" />
      <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#71717A" letter-spacing="0.5">TOKEN SPEND</text>
      <text x="20" y="68" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#38BDF8">-68%</text>
      <text x="20" y="92" font-family="-apple-system, sans-serif" font-size="11" fill="#A1A1AA">FastEmbed vector cache</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(572, 0)">
      <rect width="260" height="116" rx="10" fill="#111114" stroke="#27272A" stroke-width="1" />
      <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#71717A" letter-spacing="0.5">SECURITY</text>
      <text x="20" y="68" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#F87171">Agent Guard</text>
      <text x="20" y="92" font-family="-apple-system, sans-serif" font-size="11" fill="#A1A1AA">Pre-execution tool firewall</text>
    </g>

    <!-- Card 4 -->
    <g transform="translate(858, 0)">
      <rect width="262" height="116" rx="10" fill="#111114" stroke="#27272A" stroke-width="1" />
      <text x="20" y="32" font-family="-apple-system, sans-serif" font-size="11" font-weight="600" fill="#71717A" letter-spacing="0.5">TOPOLOGY</text>
      <text x="20" y="68" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#F59E0B">0 Daemons</text>
      <text x="20" y="92" font-family="-apple-system, sans-serif" font-size="11" fill="#A1A1AA">Zero Redis / PostgreSQL</text>
    </g>
  </g>

  <!-- Bottom Details & Author Strip -->
  <g transform="translate(80, 545)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="12" fill="#71717A">
      <tspan fill="#10B981" font-weight="600">$</tspan> pip install sentinelgate &middot; Bathini Venkata Giridhar
    </text>
    <text x="1120" y="0" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12" fill="#71717A">
      github.com/giridhar2005/sentinelgate
    </text>
  </g>
</svg>
