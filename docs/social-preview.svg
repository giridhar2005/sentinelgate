<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <!-- Dark obsidian gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="50%" stop-color="#0D0D10" />
      <stop offset="100%" stop-color="#111114" />
    </linearGradient>

    <!-- Subtle engineering grid -->
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#18181B" stroke-width="1" />
    </pattern>

    <!-- Radial glow -->
    <radialGradient id="centerGlow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#1E1E24" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="url(#bgGrad)" />
  <rect width="1280" height="640" fill="url(#centerGlow)" />
  <rect width="1280" height="640" fill="url(#grid)" />

  <!-- Outer Hairline Border -->
  <rect x="0.5" y="0.5" width="1279" height="639" fill="none" stroke="#27272A" stroke-width="1" />

  <!-- Top Accent Bar -->
  <g transform="translate(80, 80)">
    <rect x="0" y="0" width="176" height="32" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1" />
    <circle cx="20" cy="16" r="4" fill="#10B981" />
    <text x="34" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#A1A1AA" letter-spacing="0.5">OPENAI / V1 GATEWAY</text>
  </g>

  <!-- Main Monogram + Title -->
  <g transform="translate(80, 150)">
    <!-- Shield Monogram -->
    <rect x="0" y="0" width="76" height="76" rx="16" fill="#141417" stroke="#27272A" stroke-width="2" />
    <path d="M 38 18 L 22 25 V 40 C 22 50 30 58 38 61 C 46 58 54 50 54 40 V 25 Z" fill="none" stroke="#FAFAFA" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 31 39 L 36 44 L 46 34" fill="none" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Brand Typography -->
    <text x="100" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="64" font-weight="700" fill="#FFFFFF" letter-spacing="-1.5">SentinelGate</text>
  </g>

  <!-- Value Proposition -->
  <g transform="translate(80, 275)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="26" font-weight="500" fill="#E4E4E7" letter-spacing="-0.3">
      Zero-bloat, production LLM gateway backed by in-process SQLite WAL.
    </text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="18" font-weight="400" fill="#71717A" letter-spacing="-0.2">
      Semantic caching · Reversible secret firewall · Smart cost-routing · Drop-in OpenAI SDK compatibility
    </text>
  </g>

  <!-- Architecture Spec Cards (Linear / Vercel style) -->
  <g transform="translate(80, 375)">
    <!-- Card 1: Semantic Caching -->
    <rect x="0" y="0" width="260" height="120" rx="10" fill="#111114" stroke="#27272A" stroke-width="1" />
    <text x="24" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#71717A" letter-spacing="0.5">SEMANTIC CACHE</text>
    <text x="24" y="74" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#10B981">6.1 ms</text>
    <text x="24" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#A1A1AA">FastEmbed ONNX CPU</text>

    <!-- Card 2: Gateway Overhead -->
    <rect x="280" y="0" width="260" height="120" rx="10" fill="#111114" stroke="#27272A" stroke-width="1" />
    <text x="304" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#71717A" letter-spacing="0.5">MIN OVERHEAD</text>
    <text x="304" y="74" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#FFFFFF">3.3 ms</text>
    <text x="304" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#A1A1AA">Pure proxy latency</text>

    <!-- Card 3: Storage Engine -->
    <rect x="560" y="0" width="260" height="120" rx="10" fill="#111114" stroke="#27272A" stroke-width="1" />
    <text x="584" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#71717A" letter-spacing="0.5">STORAGE ENGINE</text>
    <text x="584" y="74" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#3B82F6">SQLite WAL</text>
    <text x="584" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#A1A1AA">Zero Redis / Postgres</text>

    <!-- Card 4: Cost Optimization -->
    <rect x="840" y="0" width="260" height="120" rx="10" fill="#111114" stroke="#27272A" stroke-width="1" />
    <text x="864" y="36" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" font-weight="600" fill="#71717A" letter-spacing="0.5">COST ROUTING</text>
    <text x="864" y="74" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="700" fill="#A78BFA">model="auto"</text>
    <text x="864" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12" fill="#A1A1AA">Sub-ms complexity scan</text>
  </g>

  <!-- Bottom Details Strip -->
  <g transform="translate(80, 560)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="13" fill="#52525B">
      pip install -e . &gt;&gt; sentinelgate --port 8000
    </text>
    <text x="1120" y="0" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="13" fill="#52525B">
      github.com/giridhar2005/sentinelgate
    </text>
  </g>
</svg>
