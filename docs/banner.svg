<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" width="1200" height="260">
  <defs>
    <!-- Dark obsidian background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#111113" />
    </linearGradient>

    <!-- Hairline grid pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#18181B" stroke-width="1" />
    </pattern>

    <!-- Subtle radial glow behind logo -->
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#27272A" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#09090B" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="260" fill="url(#bgGrad)" />
  <rect width="1200" height="260" fill="url(#centerGlow)" />
  <rect width="1200" height="260" fill="url(#grid)" />

  <!-- Outer Hairline Border -->
  <rect x="0.5" y="0.5" width="1199" height="259" fill="none" stroke="#27272A" stroke-width="1" />

  <!-- Top Terminal Accent Bar -->
  <g transform="translate(48, 36)">
    <!-- Terminal prompt badge -->
    <rect x="0" y="0" width="144" height="26" rx="4" fill="#18181B" stroke="#27272A" stroke-width="1" />
    <circle cx="16" cy="13" r="3.5" fill="#10B981" />
    <text x="28" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" fill="#A1A1AA" letter-spacing="0.5">OPENAI / V1 PROXY</text>
  </g>

  <!-- Main Brand Title & Icon -->
  <g transform="translate(48, 92)">
    <!-- Minimal Shield Monogram -->
    <g transform="translate(0, 4)">
      <rect x="0" y="0" width="46" height="46" rx="8" fill="#18181B" stroke="#27272A" stroke-width="1.5" />
      <path d="M 23 10 L 13 14.5 V 23.5 C 13 29.5 17.5 35 23 36.5 C 28.5 35 33 29.5 33 23.5 V 14.5 Z" fill="none" stroke="#F4F4F5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <path d="M 19 23.5 L 22 26.5 L 27.5 20.5" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Title Typography -->
    <text x="64" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="44" font-weight="700" fill="#FFFFFF" letter-spacing="-1">SentinelGate</text>
  </g>

  <!-- Subtitle Plain English -->
  <g transform="translate(48, 178)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="16" font-weight="400" fill="#A1A1AA" letter-spacing="-0.2">
      Zero-bloat OpenAI-compatible LLM gateway <tspan fill="#3F3F46">·</tspan> Local semantic cache <tspan fill="#3F3F46">·</tspan> Pre-flight guardrails <tspan fill="#3F3F46">·</tspan> SQLite state
    </text>
  </g>

  <!-- Bottom Pills / Architectural Specs -->
  <g transform="translate(48, 208)">
    <!-- Pill 1: fastembed -->
    <rect x="0" y="0" width="138" height="24" rx="4" fill="#111113" stroke="#27272A" stroke-width="1" />
    <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717A">fastembed ONNX</text>

    <!-- Pill 2: SQLite WAL -->
    <rect x="148" y="0" width="128" height="24" rx="4" fill="#111113" stroke="#27272A" stroke-width="1" />
    <text x="160" y="16" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717A">SQLite WAL Mode</text>

    <!-- Pill 3: Sub-5ms Caching -->
    <rect x="286" y="0" width="136" height="24" rx="4" fill="#111113" stroke="#27272A" stroke-width="1" />
    <text x="298" y="16" font-family="'JetBrains Mono', monospace" font-size="11" fill="#10B981">~5ms Cache Hit</text>

    <!-- Pill 4: Zero Node.js -->
    <rect x="432" y="0" width="144" height="24" rx="4" fill="#111113" stroke="#27272A" stroke-width="1" />
    <text x="444" y="16" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717A">Zero node_modules</text>
  </g>
</svg>
