<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <!-- Light Gradients & Filters -->
    <linearGradient id="bgGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <linearGradient id="panelGradLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F8FAFC" />
    </linearGradient>

    <linearGradient id="borderGradLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#E2E8F0" />
    </linearGradient>

    <linearGradient id="emeraldPillLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.04" />
    </linearGradient>

    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      @keyframes lineFade1 {
        0%, 10% { opacity: 0; transform: translateY(4px); }
        20%, 90% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; }
      }
      @keyframes lineFade2 {
        0%, 25% { opacity: 0; transform: translateY(4px); }
        35%, 90% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; }
      }
      @keyframes lineFade3 {
        0%, 45% { opacity: 0; transform: translateY(4px); }
        55%, 90% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; }
      }
      @keyframes lineFade4 {
        0%, 65% { opacity: 0; transform: translateY(4px); }
        75%, 90% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .pulse-dot {
        animation: pulseDot 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        transform-origin: 32px 42px;
      }
      .anim-line-1 { animation: lineFade1 8s infinite; }
      .anim-line-2 { animation: lineFade2 8s infinite; }
      .anim-line-3 { animation: lineFade3 8s infinite; }
      .anim-line-4 { animation: lineFade4 8s infinite; }
      .cursor { animation: cursorBlink 1s infinite; }
    </style>
  </defs>

  <!-- Canvas Surface -->
  <rect width="1200" height="500" rx="16" fill="url(#bgGradLight)" stroke="#E2E8F0" stroke-width="1.5" />

  <!-- Subtle Grid -->
  <g opacity="0.4" stroke="#E2E8F0" stroke-width="0.5">
    <line x1="40" y1="0" x2="40" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="360" y1="0" x2="360" y2="500" />
    <line x1="520" y1="0" x2="520" y2="500" />
    <line x1="680" y1="0" x2="680" y2="500" />
    <line x1="840" y1="0" x2="840" y2="500" />
    <line x1="1000" y1="0" x2="1000" y2="500" />
    <line x1="1160" y1="0" x2="1160" y2="500" />
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="0" y1="450" x2="1200" y2="450" />
  </g>

  <!-- ================= LEFT COLUMN: HERO VALUE PROPOSITION ================= -->
  <g transform="translate(48, 38)">
    
    <!-- Status Badge -->
    <g>
      <rect width="288" height="26" rx="13" fill="url(#emeraldPillLight)" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="14" cy="13" r="4" fill="#059669" class="pulse-dot" />
      <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#047857" letter-spacing="0.6">0-DEPENDENCY AI &amp; AGENT FIREWALL</text>
    </g>

    <!-- Wordmark & Version -->
    <g transform="translate(0, 56)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-size="40" font-weight="800" fill="#0F172A" letter-spacing="-1.2">
        SentinelGate
      </text>
      <rect x="268" y="-28" width="58" height="22" rx="5" fill="#F1F5F9" stroke="#CBD5E1" stroke-width="1" />
      <text x="297" y="-13" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#059669">v0.5.0</text>
    </g>

    <!-- Subhead Description -->
    <g transform="translate(0, 94)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14.5" fill="#475569" font-weight="400">
        In-process OpenAI-compatible gateway with SQLite WAL
      </text>
      <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14.5" fill="#475569" font-weight="400">
        semantic caching, pre-execution tool firewalls, and secret redaction.
      </text>
    </g>

    <!-- 3 Telemetry Cards -->
    <g transform="translate(0, 150)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="148" height="78" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B" text-transform="uppercase" letter-spacing="0.5">Proxy Overhead</text>
        <text x="14" y="52" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#059669">&lt;0.5ms</text>
        <text x="14" y="68" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94A3B8">0 network hops (mmap)</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(160, 0)">
        <rect width="148" height="78" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B" text-transform="uppercase" letter-spacing="0.5">Token Spend</text>
        <text x="14" y="52" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#0284C7">-68%</text>
        <text x="14" y="68" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94A3B8">Cache + auto-routing</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(320, 0)">
        <rect width="148" height="78" rx="8" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" />
        <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#64748B" text-transform="uppercase" letter-spacing="0.5">Dependencies</text>
        <text x="14" y="52" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#D97706">0 Daemons</text>
        <text x="14" y="68" font-family="-apple-system, sans-serif" font-size="9.5" fill="#94A3B8">Zero Redis / Postgres</text>
      </g>
    </g>

    <!-- Architecture Tech Stack Pills -->
    <g transform="translate(0, 252)">
      <rect x="0" y="0" width="84" height="22" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
      <text x="42" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#334155">SQLite WAL</text>

      <rect x="92" y="0" width="112" height="22" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
      <text x="148" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#334155">FastEmbed ONNX</text>

      <rect x="212" y="0" width="68" height="22" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
      <text x="246" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#334155">FastAPI</text>

      <rect x="288" y="0" width="80" height="22" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
      <text x="328" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#334155">W3C OTLP</text>

      <rect x="376" y="0" width="92" height="22" rx="4" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="1" />
      <text x="422" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#334155">Python 3.11+</text>
    </g>

    <!-- Quick CTA hint -->
    <g transform="translate(0, 304)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#64748B">
        <tspan fill="#059669" font-weight="600">$</tspan> pip install sentinelgate <tspan fill="#94A3B8">&amp;&amp;</tspan> sentinelgate --demo
      </text>
    </g>

  </g>

  <!-- ================= RIGHT COLUMN: ANIMATED TELEMETRY TERMINAL ================= -->
  <g transform="translate(570, 38)">
    
    <!-- Window Frame -->
    <rect width="582" height="424" rx="10" fill="url(#panelGradLight)" stroke="url(#borderGradLight)" stroke-width="1.2" />

    <!-- Terminal Header Bar -->
    <rect width="582" height="34" rx="10" fill="#F1F5F9" />
    <rect y="24" width="582" height="10" fill="#F1F5F9" />
    <line x1="0" y1="34" x2="582" y2="34" stroke="#E2E8F0" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="18" cy="17" r="4.5" fill="#EF4444" opacity="0.8" />
    <circle cx="32" cy="17" r="4.5" fill="#F59E0B" opacity="0.8" />
    <circle cx="46" cy="17" r="4.5" fill="#10B981" opacity="0.8" />

    <text x="291" y="21" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#64748B">
      sentinelgate-runtime · port 8000 · operational HUD
    </text>

    <!-- Live Telemetry Stream Inside Terminal -->
    <g transform="translate(20, 56)" font-family="'JetBrains Mono', monospace" font-size="11">
      
      <!-- Static Engine Ready Line -->
      <g transform="translate(0, 0)">
        <text x="0" y="0" fill="#94A3B8">[0.00ms]</text>
        <text x="64" y="0" fill="#059669" font-weight="600">ENGINE READY</text>
        <text x="160" y="0" fill="#475569">SQLite WAL mode initialized (mmap: 256MB)</text>
      </g>

      <g transform="translate(0, 20)">
        <text x="0" y="0" fill="#94A3B8">[0.12ms]</text>
        <text x="64" y="0" fill="#0284C7" font-weight="600">ROUTER LOADED</text>
        <text x="160" y="0" fill="#475569">FastEmbed ONNX (BAAI/bge-small-en-v1.5) CPU</text>
      </g>

      <line x1="0" y1="32" x2="542" y2="32" stroke="#E2E8F0" stroke-width="1" stroke-dasharray="3 3" />

      <!-- Animated Event 1: Secret Redaction in Flight -->
      <g transform="translate(0, 52)" class="anim-line-1">
        <rect x="-6" y="-12" width="554" height="48" rx="6" fill="#F5F3FF" stroke="#8B5CF6" stroke-width="0.8" stroke-opacity="0.3" />
        <text x="4" y="4" fill="#7C3AED" font-weight="700">[REDACT]</text>
        <text x="76" y="4" fill="#1E293B">Outbound prompt scanned in 0.08ms</text>
        <text x="4" y="24" fill="#64748B">Scrubbed: <tspan fill="#DC2626">sk-proj-9a88...71f</tspan> → <tspan fill="#059669">__SG_SECRET_1__</tspan> (restored inbound)</text>
      </g>

      <!-- Animated Event 2: Local FastEmbed Cache Hit -->
      <g transform="translate(0, 116)" class="anim-line-2">
        <rect x="-6" y="-12" width="554" height="48" rx="6" fill="#F0FDF4" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.4" />
        <text x="4" y="4" fill="#059669" font-weight="700">[CACHE HIT]</text>
        <text x="88" y="4" fill="#1E293B">Cosine Match: <tspan fill="#059669" font-weight="700">0.9412</tspan> · <tspan fill="#0284C7">FastEmbed CPU</tspan></text>
        <text x="4" y="24" fill="#64748B">Latency: <tspan fill="#059669" font-weight="700">1.14ms</tspan> · Upstream Egress Cost: <tspan fill="#059669" font-weight="700">$0.000000</tspan></text>
      </g>

      <!-- Animated Event 3: Pre-Execution Agent Tool Firewall Block -->
      <g transform="translate(0, 180)" class="anim-line-3">
        <rect x="-6" y="-12" width="554" height="60" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="0.8" stroke-opacity="0.4" />
        <text x="4" y="4" fill="#DC2626" font-weight="700">[BLOCKED]</text>
        <text x="78" y="4" fill="#991B1B">Pre-Execution Agent Tool Firewall (0.18ms)</text>
        <text x="4" y="24" fill="#DC2626">Threat: DESTRUCTIVE_SHELL · bash(command="rm -rf /")</text>
        <text x="4" y="40" fill="#64748B">Action: Synthetic OpenAI Refusal · Agent safely self-corrects</text>
      </g>

      <!-- Animated Event 4: Upstream Outage Failover & OTLP Trace -->
      <g transform="translate(0, 258)" class="anim-line-4">
        <rect x="-6" y="-12" width="554" height="48" rx="6" fill="#FFFBEB" stroke="#F59E0B" stroke-width="0.8" stroke-opacity="0.4" />
        <text x="4" y="4" fill="#D97706" font-weight="700">[FAILOVER]</text>
        <text x="88" y="4" fill="#92400E">Primary HTTP 429 → Secondary Groq (0 dropped reqs)</text>
        <text x="4" y="24" fill="#64748B">Trace: <tspan fill="#334155">00-7c98b2-a4f-01</tspan> · OTLP JSON Flushed to Queue</text>
      </g>

      <!-- Bottom Status Line with blinking cursor -->
      <g transform="translate(0, 332)">
        <text x="0" y="0" fill="#94A3B8">$</text>
        <text x="14" y="0" fill="#334155">sentinelgate metrics --live</text>
        <rect x="222" y="-10" width="7" height="13" fill="#059669" class="cursor" />
      </g>

    </g>

  </g>

</svg>
