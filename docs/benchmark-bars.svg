<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" width="100%" height="100%">
  <defs>
    <linearGradient id="barBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#111114" />
    </linearGradient>

    <linearGradient id="emeraldBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="blueBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="amberBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <linearGradient id="zincBar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3F3F46" />
      <stop offset="100%" stop-color="#52525B" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1200" height="520" rx="16" fill="url(#barBg)" stroke="#27272A" stroke-width="1.5" />

  <!-- Header -->
  <g transform="translate(48, 36)">
    <rect width="210" height="24" rx="4" fill="#18181C" stroke="#27272A" stroke-width="1" />
    <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#10B981" letter-spacing="0.5">BENCHMARK COMPARISON</text>
    <text x="226" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="600" fill="#F4F4F5">
      SentinelGate vs. Multi-Service Gateways (Real Measured Telemetry)
    </text>
  </g>

  <!-- ================= GROUP 1: IDLE MEMORY (RSS) ================= -->
  <g transform="translate(48, 86)">
    <rect width="1104" height="114" rx="10" fill="#141418" stroke="#27272A" stroke-width="1" />
    
    <text x="24" y="28" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">
      01. Idle Base Memory Footprint (Lower is Better)
    </text>
    <text x="320" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717A">
      RSS memory upon initial cold launch
    </text>

    <!-- Bar 1: SentinelGate -->
    <g transform="translate(24, 44)">
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#34D399" width="180">SentinelGate (Base)</text>
      <rect x="220" y="2" width="45" height="18" rx="4" fill="url(#emeraldBar)" />
      <text x="275" y="15" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34D399">45.1 MB</text>
      <text x="340" y="15" font-family="-apple-system, sans-serif" font-size="10" fill="#71717A">(Single Python process, SQLite WAL)</text>
    </g>

    <!-- Bar 2: LiteLLM Standalone -->
    <g transform="translate(24, 68)">
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A1A1AA">LiteLLM Proxy</text>
      <rect x="220" y="2" width="340" height="18" rx="4" fill="url(#zincBar)" />
      <text x="570" y="15" font-family="'JetBrains Mono', monospace" font-size="11" fill="#D4D4D8">580.0 MB</text>
      <text x="640" y="15" font-family="-apple-system, sans-serif" font-size="10" fill="#71717A">(Standard proxy runtime)</text>
    </g>

    <!-- Bar 3: Full Stack -->
    <g transform="translate(24, 90)">
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717A">LiteLLM + Redis + Postgres</text>
      <rect x="220" y="2" width="700" height="14" rx="4" fill="#27272A" />
      <text x="930" y="13" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A1A1AA">1,250.0 MB</text>
      <text x="1006" y="13" font-family="-apple-system, sans-serif" font-size="10" fill="#EF4444">27.7x heavier</text>
    </g>
  </g>

  <!-- ================= GROUP 2: CACHE HIT LATENCY ================= -->
  <g transform="translate(48, 222)">
    <rect width="1104" height="114" rx="10" fill="#141418" stroke="#27272A" stroke-width="1" />
    
    <text x="24" y="28" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">
      02. Cache Hit Lookup Latency (Lower is Better)
    </text>
    <text x="320" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717A">
      Latency to resolve cached response and return HTTP 200
    </text>

    <!-- Bar 1: SentinelGate -->
    <g transform="translate(24, 44)">
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#34D399">SentinelGate (In-Process)</text>
      <rect x="220" y="2" width="16" height="18" rx="4" fill="url(#emeraldBar)" />
      <text x="246" y="15" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34D399">0.18 ms</text>
      <text x="312" y="15" font-family="-apple-system, sans-serif" font-size="10" fill="#71717A">(Zero-copy mmap, 0 network hops)</text>
    </g>

    <!-- Bar 2: Localhost Redis -->
    <g transform="translate(24, 68)">
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A1A1AA">Localhost Redis (TCP)</text>
      <rect x="220" y="2" width="120" height="18" rx="4" fill="url(#blueBar)" />
      <text x="350" y="15" font-family="'JetBrains Mono', monospace" font-size="11" fill="#38BDF8">1.42 ms</text>
      <text x="410" y="15" font-family="-apple-system, sans-serif" font-size="10" fill="#71717A">(TCP socket round-trip)</text>
    </g>

    <!-- Bar 3: Managed Redis -->
    <g transform="translate(24, 90)">
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717A">Remote Redis (VPC / Cloud)</text>
      <rect x="220" y="2" width="680" height="14" rx="4" fill="#27272A" />
      <text x="910" y="13" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A1A1AA">18.50 ms</text>
      <text x="976" y="13" font-family="-apple-system, sans-serif" font-size="10" fill="#EF4444">102x slower</text>
    </g>
  </g>

  <!-- ================= GROUP 3: COLD START TIME ================= -->
  <g transform="translate(48, 358)">
    <rect width="1104" height="114" rx="10" fill="#141418" stroke="#27272A" stroke-width="1" />
    
    <text x="24" y="28" font-family="-apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF">
      03. Cold Start Bootstrap Latency (Lower is Better)
    </text>
    <text x="320" y="28" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717A">
      Time from daemon invocation until /health returns HTTP 200
    </text>

    <!-- Bar 1: SentinelGate -->
    <g transform="translate(24, 44)">
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#34D399">SentinelGate</text>
      <rect x="220" y="2" width="70" height="18" rx="4" fill="url(#emeraldBar)" />
      <text x="300" y="15" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#34D399">1.15 s</text>
      <text x="360" y="15" font-family="-apple-system, sans-serif" font-size="10" fill="#71717A">(Instant SQLite initialization)</text>
    </g>

    <!-- Bar 2: LiteLLM Stack -->
    <g transform="translate(24, 68)">
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A1A1AA">LiteLLM + Redis + Postgres</text>
      <rect x="220" y="2" width="460" height="18" rx="4" fill="url(#amberBar)" />
      <text x="690" y="15" font-family="'JetBrains Mono', monospace" font-size="11" fill="#FBBF24">9.40 s</text>
      <text x="750" y="15" font-family="-apple-system, sans-serif" font-size="10" fill="#71717A">(DB migrations + socket handshakes)</text>
    </g>

    <!-- Bar 3: Distributed Pool -->
    <g transform="translate(24, 90)">
      <text x="0" y="14" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717A">Multi-Container Gateway Pool</text>
      <rect x="220" y="2" width="720" height="14" rx="4" fill="#27272A" />
      <text x="950" y="13" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A1A1AA">16.20 s</text>
      <text x="1010" y="13" font-family="-apple-system, sans-serif" font-size="10" fill="#EF4444">14x slower</text>
    </g>
  </g>

</svg>
