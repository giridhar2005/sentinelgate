<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340">
  <defs>
    <!-- Dark Obsidian Gradient -->
    <linearGradient id="flowBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#111114" />
    </linearGradient>

    <!-- Hairline Grid -->
    <pattern id="flowGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#18181B" stroke-width="1" />
    </pattern>

    <!-- Card Background -->
    <linearGradient id="stepGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#0E0E11" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" fill="url(#flowBg)" />
  <rect width="1200" height="340" fill="url(#flowGrid)" />
  <rect x="0.5" y="0.5" width="1199" height="339" fill="none" stroke="#27272A" stroke-width="1" />

  <!-- Section Header -->
  <g transform="translate(48, 30)">
    <rect x="0" y="0" width="184" height="22" rx="4" fill="#18181B" stroke="#27272A" stroke-width="1" />
    <text x="10" y="15" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#3B82F6" letter-spacing="1">REQUEST LIFECYCLE</text>
    <text x="200" y="15" font-family="'JetBrains Mono', monospace" font-size="11" fill="#71717A">Deterministic Microsecond Execution Pipeline</text>
    <text x="0" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">Under 5 Milliseconds from Socket to Stream</text>
  </g>

  <!-- 5 Sequential Pipeline Steps -->
  <g transform="translate(48, 96)">

    <!-- Step 1: Secret Shield -->
    <g transform="translate(0, 0)">
      <rect width="204" height="186" rx="8" fill="url(#stepGrad)" stroke="#27272A" stroke-width="1" />
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="21" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#8B5CF6">01</text>
      <text x="50" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#8B5CF6">CREDENTIAL SHIELD</text>
      <text x="50" y="38" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#71717A">&lt; 0.25 ms</text>

      <text x="14" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Reversible Tokens</text>
      <text x="14" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#A1A1AA">
        Intercepts sk-..., AWS, JWT, and DB URIs. Replaces with __SG_SECRET_X__.
      </text>

      <line x1="14" y1="142" x2="190" y2="142" stroke="#27272A" stroke-width="1" />
      <text x="14" y="164" font-family="'JetBrains Mono', monospace" font-size="10" fill="#8B5CF6">ZERO LEAKS</text>
      <text x="190" y="164" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#52525B">outbound</text>
    </g>

    <!-- Connector Arrow 1 -->
    <path d="M 212 93 L 220 93" stroke="#3F3F46" stroke-width="2" stroke-linecap="round" />
    <polygon points="220,90 226,93 220,96" fill="#71717A" />

    <!-- Step 2: Tenant Limiter -->
    <g transform="translate(226, 0)">
      <rect width="204" height="186" rx="8" fill="url(#stepGrad)" stroke="#27272A" stroke-width="1" />
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="21" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#71717A">02</text>
      <text x="50" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#A1A1AA">TENANT BUDGET</text>
      <text x="50" y="38" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#71717A">&lt; 0.08 ms</text>

      <text x="14" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Memory-Mapped Limiter</text>
      <text x="14" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#A1A1AA">
        Token-bucket RPM &amp; monthly spend ceiling validated directly in SQLite pages.
      </text>

      <line x1="14" y1="142" x2="190" y2="142" stroke="#27272A" stroke-width="1" />
      <text x="14" y="164" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10B981">ACID MMAP</text>
      <text x="190" y="164" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#52525B">zero IPC</text>
    </g>

    <!-- Connector Arrow 2 -->
    <path d="M 438 93 L 446 93" stroke="#3F3F46" stroke-width="2" stroke-linecap="round" />
    <polygon points="446,90 452,93 446,96" fill="#71717A" />

    <!-- Step 3: Vector Cache -->
    <g transform="translate(452, 0)">
      <rect width="204" height="186" rx="8" fill="url(#stepGrad)" stroke="#27272A" stroke-width="1" />
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="21" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#10B981">03</text>
      <text x="50" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#10B981">VECTOR CACHE</text>
      <text x="50" y="38" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#71717A">&lt; 1.80 ms</text>

      <text x="14" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">FastEmbed ONNX CPU</text>
      <text x="14" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#A1A1AA">
        Computes 384-dim dense vector. Cosine sim ≥ 0.92 returns cached result instantly.
      </text>

      <line x1="14" y1="142" x2="190" y2="142" stroke="#27272A" stroke-width="1" />
      <text x="14" y="164" font-family="'JetBrains Mono', monospace" font-size="10" fill="#10B981">$0.00 COST</text>
      <text x="190" y="164" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#52525B">cache hit</text>
    </g>

    <!-- Connector Arrow 3 -->
    <path d="M 664 93 L 672 93" stroke="#3F3F46" stroke-width="2" stroke-linecap="round" />
    <polygon points="672,90 678,93 672,96" fill="#71717A" />

    <!-- Step 4: Cost Router -->
    <g transform="translate(678, 0)">
      <rect width="204" height="186" rx="8" fill="url(#stepGrad)" stroke="#27272A" stroke-width="1" />
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="21" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#3B82F6">04</text>
      <text x="50" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#3B82F6">COST ROUTER</text>
      <text x="50" y="38" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#71717A">&lt; 0.18 ms</text>

      <text x="14" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">model="auto" Arbitrage</text>
      <text x="14" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#A1A1AA">
        Scores prompt complexity. Simple queries to Ollama/Groq, complex to Claude/GPT-4o.
      </text>

      <line x1="14" y1="142" x2="190" y2="142" stroke="#27272A" stroke-width="1" />
      <text x="14" y="164" font-family="'JetBrains Mono', monospace" font-size="10" fill="#3B82F6">UP TO 99%</text>
      <text x="190" y="164" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#52525B">arbitraged</text>
    </g>

    <!-- Connector Arrow 4 -->
    <path d="M 890 93 L 898 93" stroke="#3F3F46" stroke-width="2" stroke-linecap="round" />
    <polygon points="898,90 904,93 898,96" fill="#71717A" />

    <!-- Step 5: Failover & Rehydrate -->
    <g transform="translate(904, 0)">
      <rect width="200" height="186" rx="8" fill="url(#stepGrad)" stroke="#27272A" stroke-width="1" />
      <rect x="14" y="14" width="28" height="28" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="21" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" fill="#F59E0B">05</text>
      <text x="50" y="26" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#F59E0B">STREAM &amp; RESTORE</text>
      <text x="50" y="38" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#71717A">Zero-drop</text>

      <text x="14" y="68" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13" font-weight="600" fill="#FFFFFF">Circuit Failover</text>
      <text x="14" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#A1A1AA">
        Automatic retry on 429/503. Hydrates __SG_SECRET_X__ back into live stream.
      </text>

      <line x1="14" y1="142" x2="186" y2="142" stroke="#27272A" stroke-width="1" />
      <text x="14" y="164" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F59E0B">ZERO-DROP</text>
      <text x="186" y="164" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="9.5" fill="#52525B">SSE stream</text>
    </g>

  </g>

  <!-- Bottom Details Strip -->
  <g transform="translate(48, 308)">
    <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#52525B">
      Client API: <tspan fill="#71717A">POST /v1/chat/completions</tspan> · Drop-in OpenAI SDK compatibility
    </text>
    <text x="1104" y="0" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#52525B">
      Single Python process · <tspan fill="#10B981">FastAPI + SQLite WAL</tspan>
    </text>
  </g>
</svg>
