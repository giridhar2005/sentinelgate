<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 580" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bentoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="50%" stop-color="#0E0E12" />
      <stop offset="100%" stop-color="#121216" />
    </linearGradient>

    <linearGradient id="cardBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#0F0F13" />
    </linearGradient>

    <linearGradient id="cardStroke" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E2E35" />
      <stop offset="100%" stop-color="#1E1E24" />
    </linearGradient>
  </defs>

  <!-- Canvas Surface -->
  <rect width="1200" height="580" rx="16" fill="url(#bentoBg)" stroke="#27272A" stroke-width="1.5" />

  <!-- Grid Accents -->
  <g opacity="0.08" stroke="#3F3F46" stroke-width="0.5">
    <line x1="600" y1="0" x2="600" y2="580" />
    <line x1="0" y1="290" x2="1200" y2="290" />
  </g>

  <!-- Header Strip -->
  <g transform="translate(48, 38)">
    <rect width="210" height="24" rx="4" fill="#18181C" stroke="#27272A" stroke-width="1" />
    <text x="12" y="16" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#10B981" letter-spacing="0.5">IN-PROCESS ARCHITECTURE</text>
    <text x="226" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14" font-weight="600" fill="#F4F4F5">
      The 4 In-Process Pipeline Quadrants · Zero Network Hops
    </text>
  </g>

  <!-- ================= BENTO CARD 1: PRE-FLIGHT SECRET & INJECTION SHIELD ================= -->
  <g transform="translate(48, 76)">
    <rect width="536" height="224" rx="12" fill="url(#cardBg)" stroke="url(#cardStroke)" stroke-width="1" />
    
    <!-- Top Pill -->
    <g transform="translate(20, 20)">
      <rect width="176" height="22" rx="4" fill="#1C182A" stroke="#8B5CF6" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="10" cy="11" r="3" fill="#A78BFA" />
      <text x="20" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#C4B5FD">01 / PRE-FLIGHT SHIELD</text>
    </g>

    <!-- Card Title -->
    <text x="20" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">
      Sliding-Window Secret &amp; Injection Guard
    </text>

    <!-- Description -->
    <text x="20" y="94" font-family="-apple-system, sans-serif" font-size="12" fill="#A1A1AA">
      Scans outbound prompts and SSE stream deltas before network egress.
    </text>

    <!-- Bullet Specs -->
    <g transform="translate(20, 122)" font-family="'JetBrains Mono', monospace" font-size="11">
      <text x="0" y="0" fill="#8B5CF6">&bull;</text>
      <text x="14" y="0" fill="#D4D4D8">Reversible tokenization (<tspan fill="#A78BFA">sk-proj-***</tspan> &rarr; <tspan fill="#34D399">__SG_SECRET_1__</tspan>)</text>

      <text x="0" y="24" fill="#8B5CF6">&bull;</text>
      <text x="14" y="24" fill="#D4D4D8">Async N=64 char lookahead catches split streaming tokens</text>

      <text x="0" y="48" fill="#8B5CF6">&bull;</text>
      <text x="14" y="48" fill="#D4D4D8">Sub-millisecond prompt injection AST heuristic (&lt;0.08ms)</text>

      <text x="0" y="72" fill="#8B5CF6">&bull;</text>
      <text x="14" y="72" fill="#D4D4D8">Zero cloud telemetry or third-party credential leakage</text>
    </g>
  </g>

  <!-- ================= BENTO CARD 2: IN-PROCESS SEMANTIC CACHE ================= -->
  <g transform="translate(616, 76)">
    <rect width="536" height="224" rx="12" fill="url(#cardBg)" stroke="url(#cardStroke)" stroke-width="1" />
    
    <!-- Top Pill -->
    <g transform="translate(20, 20)">
      <rect width="186" height="22" rx="4" fill="#0D2218" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="10" cy="11" r="3" fill="#10B981" />
      <text x="20" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#6EE7B7">02 / LOCAL SEMANTIC CACHE</text>
    </g>

    <!-- Card Title -->
    <text x="20" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">
      In-Process FastEmbed ONNX &amp; SQLite WAL
    </text>

    <!-- Description -->
    <text x="20" y="94" font-family="-apple-system, sans-serif" font-size="12" fill="#A1A1AA">
      Runs vector similarity directly on CPU with zero network serialization.
    </text>

    <!-- Bullet Specs -->
    <g transform="translate(20, 122)" font-family="'JetBrains Mono', monospace" font-size="11">
      <text x="0" y="0" fill="#10B981">&bull;</text>
      <text x="14" y="0" fill="#D4D4D8"><tspan fill="#34D399">BAAI/bge-small-en-v1.5</tspan> ONNX embedding on CPU (&lt;2ms)</text>

      <text x="0" y="24" fill="#10B981">&bull;</text>
      <text x="14" y="24" fill="#D4D4D8">SQLite WAL mode (<tspan fill="#38BDF8">PRAGMA mmap_size=256MB</tspan>, 0 TCP sockets)</text>

      <text x="0" y="48" fill="#10B981">&bull;</text>
      <text x="14" y="48" fill="#D4D4D8">68% of repetitive queries answered at exactly <tspan fill="#34D399">$0.00 cost</tspan></text>

      <text x="0" y="72" fill="#10B981">&bull;</text>
      <text x="14" y="72" fill="#D4D4D8">14,200 req/sec peak throughput on a single core</text>
    </g>
  </g>

  <!-- ================= BENTO CARD 3: SMART COST ROUTER ================= -->
  <g transform="translate(48, 320)">
    <rect width="536" height="224" rx="12" fill="url(#cardBg)" stroke="url(#cardStroke)" stroke-width="1" />
    
    <!-- Top Pill -->
    <g transform="translate(20, 20)">
      <rect width="180" height="22" rx="4" fill="#0C1F33" stroke="#38BDF8" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="10" cy="11" r="3" fill="#38BDF8" />
      <text x="20" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#7DD3FC">03 / SMART COST ROUTER</text>
    </g>

    <!-- Card Title -->
    <text x="20" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">
      Microsecond Complexity &amp; Hedged Routing
    </text>

    <!-- Description -->
    <text x="20" y="94" font-family="-apple-system, sans-serif" font-size="12" fill="#A1A1AA">
      model="auto" classifies prompt syntax and reasoning density in &lt;0.2ms.
    </text>

    <!-- Bullet Specs -->
    <g transform="translate(20, 122)" font-family="'JetBrains Mono', monospace" font-size="11">
      <text x="0" y="0" fill="#38BDF8">&bull;</text>
      <text x="14" y="0" fill="#D4D4D8">Utility routing: 80% tasks sent to <tspan fill="#38BDF8">$0.15/1M</tspan> fast models</text>

      <text x="0" y="24" fill="#38BDF8">&bull;</text>
      <text x="14" y="24" fill="#D4D4D8">Frontier escalation: complex code diffs route to $15/1M</text>

      <text x="0" y="48" fill="#38BDF8">&bull;</text>
      <text x="14" y="48" fill="#D4D4D8">Speculative Hedging: duplicate requests slash p99 tail by <tspan fill="#38BDF8">80.4%</tspan></text>

      <text x="0" y="72" fill="#38BDF8">&bull;</text>
      <text x="14" y="72" fill="#D4D4D8">Multi-tenant dual-bucket rate limiter (RPM + TPM atomic)</text>
    </g>
  </g>

  <!-- ================= BENTO CARD 4: AGENT & FAULT SHIELD ================= -->
  <g transform="translate(616, 320)">
    <rect width="536" height="224" rx="12" fill="url(#cardBg)" stroke="url(#cardStroke)" stroke-width="1" />
    
    <!-- Top Pill -->
    <g transform="translate(20, 20)">
      <rect width="186" height="22" rx="4" fill="#241113" stroke="#EF4444" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="10" cy="11" r="3" fill="#EF4444" />
      <text x="20" y="15" font-family="'JetBrains Mono', monospace" font-size="9.5" font-weight="700" fill="#FCA5A5">04 / AGENT &amp; FAULT SHIELD</text>
    </g>

    <!-- Card Title -->
    <text x="20" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="16" font-weight="700" fill="#FFFFFF">
      Pre-Execution Agent Firewall &amp; Failover
    </text>

    <!-- Description -->
    <text x="20" y="94" font-family="-apple-system, sans-serif" font-size="12" fill="#A1A1AA">
      Intercepts assistant tool calls and upstream outages before client execution.
    </text>

    <!-- Bullet Specs -->
    <g transform="translate(20, 122)" font-family="'JetBrains Mono', monospace" font-size="11">
      <text x="0" y="0" fill="#EF4444">&bull;</text>
      <text x="14" y="0" fill="#D4D4D8">Blocks <tspan fill="#F87171">rm -rf</tspan>, <tspan fill="#F87171">DROP TABLE</tspan>, and SSRF to <tspan fill="#F87171">169.254.169.254</tspan></text>

      <text x="0" y="24" fill="#EF4444">&bull;</text>
      <text x="14" y="24" fill="#D4D4D8">Synthesizes OpenAI refusals so agents recover safely</text>

      <text x="0" y="48" fill="#EF4444">&bull;</text>
      <text x="14" y="48" fill="#D4D4D8">Dynamic circuit breaker: 429/500/503 fails over with 0 dropped reqs</text>

      <text x="0" y="72" fill="#EF4444">&bull;</text>
      <text x="14" y="72" fill="#D4D4D8">Zero-dependency OTLP JSON tracing + W3C traceparent</text>
    </g>
  </g>

</svg>
