<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="100%" stop-color="#111114" />
    </linearGradient>

    <!-- Hairline Grid -->
    <pattern id="cardGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#18181B" stroke-width="1" />
    </pattern>

    <!-- Card Background Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141417" />
      <stop offset="100%" stop-color="#0F0F12" />
    </linearGradient>
  </defs>

  <!-- Canvas -->
  <rect width="1200" height="320" fill="url(#bgGrad)" />
  <rect width="1200" height="320" fill="url(#cardGrid)" />
  <rect x="0.5" y="0.5" width="1199" height="319" fill="none" stroke="#27272A" stroke-width="1" />

  <!-- Section Title Header -->
  <g transform="translate(48, 36)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" font-weight="600" fill="#71717A" letter-spacing="1.2">CORE ARCHITECTURAL PILLARS</text>
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="20" font-weight="700" fill="#FFFFFF" letter-spacing="-0.5">Engineered for Sub-Millisecond Critical Paths</text>
  </g>

  <!-- 4 Pillar Cards Grid -->
  <g transform="translate(48, 85)">
    <!-- Card 1: Semantic Caching -->
    <g transform="translate(0, 0)">
      <rect width="260" height="195" rx="8" fill="url(#cardGrad)" stroke="#27272A" stroke-width="1" />
      <rect x="16" y="16" width="32" height="32" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <circle cx="32" cy="32" r="5" fill="#10B981" />
      <text x="56" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#10B981">PILLAR 01</text>
      <text x="56" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" fill="#71717A">IN-PROCESS CACHE</text>

      <text x="16" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">FastEmbed + SQLite WAL</text>
      <text x="16" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#A1A1AA" width="228">
        Computes 384-dim dense vectors on CPU via ONNX. Matches cosine similarity ≥ 0.92 in &lt;2ms at $0.00 cost.
      </text>

      <line x1="16" y1="148" x2="244" y2="148" stroke="#27272A" stroke-width="1" />
      <text x="16" y="172" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#10B981">~6.1ms avg hit</text>
      <text x="244" y="172" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717A">zero network hops</text>
    </g>

    <!-- Card 2: Secret & PII Shield -->
    <g transform="translate(280, 0)">
      <rect width="260" height="195" rx="8" fill="url(#cardGrad)" stroke="#27272A" stroke-width="1" />
      <rect x="16" y="16" width="32" height="32" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <circle cx="32" cy="32" r="5" fill="#8B5CF6" />
      <text x="56" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#8B5CF6">PILLAR 02</text>
      <text x="56" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" fill="#71717A">CREDENTIAL SHIELD</text>

      <text x="16" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Reversible Redaction</text>
      <text x="16" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#A1A1AA">
        Sub-ms regex tokenizes OpenAI, AWS, GitHub keys &amp; DB URIs outbound. Restores original values in response.
      </text>

      <line x1="16" y1="148" x2="244" y2="148" stroke="#27272A" stroke-width="1" />
      <text x="16" y="172" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#8B5CF6">&lt;0.3ms latency</text>
      <text x="244" y="172" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717A">zero code break</text>
    </g>

    <!-- Card 3: Smart Cost-Router -->
    <g transform="translate(560, 0)">
      <rect width="260" height="195" rx="8" fill="url(#cardGrad)" stroke="#27272A" stroke-width="1" />
      <rect x="16" y="16" width="32" height="32" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <circle cx="32" cy="32" r="5" fill="#3B82F6" />
      <text x="56" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#3B82F6">PILLAR 03</text>
      <text x="56" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" fill="#71717A">COST ROUTER</text>

      <text x="16" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">model="auto" Arbitrage</text>
      <text x="16" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#A1A1AA">
        Scores prompt complexity in &lt;0.2ms. Routes simple prompts to cheap utility models and complex tasks to frontier LLMs.
      </text>

      <line x1="16" y1="148" x2="244" y2="148" stroke="#27272A" stroke-width="1" />
      <text x="16" y="172" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#3B82F6">up to 99% saved</text>
      <text x="244" y="172" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717A">frontier quality</text>
    </g>

    <!-- Card 4: Circuit Breaker & Failover -->
    <g transform="translate(840, 0)">
      <rect width="264" height="195" rx="8" fill="url(#cardGrad)" stroke="#27272A" stroke-width="1" />
      <rect x="16" y="16" width="32" height="32" rx="6" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <circle cx="32" cy="32" r="5" fill="#F59E0B" />
      <text x="56" y="32" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#F59E0B">PILLAR 04</text>
      <text x="56" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="10" fill="#71717A">SELF-HEALING</text>

      <text x="16" y="76" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF">Circuit Failover</text>
      <text x="16" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="11" fill="#A1A1AA">
        Automatic retry on 429/503 across Groq, Gemini, Ollama with round-robin keys, 30s cooldowns, and latency hedging.
      </text>

      <line x1="16" y1="148" x2="248" y2="148" stroke="#27272A" stroke-width="1" />
      <text x="16" y="172" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#F59E0B">zero dropped reqs</text>
      <text x="248" y="172" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="10" fill="#71717A">live SSE drain</text>
    </g>
  </g>
</svg>
