<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <!-- Dark Gradients & Filters -->
    <linearGradient id="bgGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090B" />
      <stop offset="50%" stop-color="#0D0D11" />
      <stop offset="100%" stop-color="#111114" />
    </linearGradient>

    <linearGradient id="panelGradDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141418" />
      <stop offset="100%" stop-color="#0E0E12" />
    </linearGradient>

    <linearGradient id="borderGradDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272A" />
      <stop offset="50%" stop-color="#3F3F46" />
      <stop offset="100%" stop-color="#1F1F23" />
    </linearGradient>

    <linearGradient id="emeraldPill" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#059669" stop-opacity="0.05" />
    </linearGradient>

    <style>
      @keyframes pulseDot {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.4; transform: scale(0.85); }
      }
      @keyframes lineFade1 {
        0%, 10% { opacity: 0; transform: translateY(4px); }
        20%, 90% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; }
      }
      @keyframes lineFade2 {
        0%, 25% { opacity: 0; transform: translateY(4px); }
        35%, 90% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; }
      }
      @keyframes lineFade3 {
        0%, 45% { opacity: 0; transform: translateY(4px); }
        55%, 90% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; }
      }
      @keyframes lineFade4 {
        0%, 65% { opacity: 0; transform: translateY(4px); }
        75%, 90% { opacity: 1; transform: translateY(0); }
        98%, 100% { opacity: 0; }
      }
      @keyframes cursorBlink {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }

      .pulse-dot {
        animation: pulseDot 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        transform-origin: 32px 42px;
      }
      .anim-line-1 { animation: lineFade1 8s infinite; }
      .anim-line-2 { animation: lineFade2 8s infinite; }
      .anim-line-3 { animation: lineFade3 8s infinite; }
      .anim-line-4 { animation: lineFade4 8s infinite; }
      .cursor { animation: cursorBlink 1s infinite; }
    </style>
  </defs>

  <!-- Canvas Surface -->
  <rect width="1200" height="500" rx="16" fill="url(#bgGradDark)" stroke="#27272A" stroke-width="1.5" />

  <!-- Subtle Blueprint Grid -->
  <g opacity="0.12" stroke="#3F3F46" stroke-width="0.5">
    <line x1="40" y1="0" x2="40" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="360" y1="0" x2="360" y2="500" />
    <line x1="520" y1="0" x2="520" y2="500" />
    <line x1="680" y1="0" x2="680" y2="500" />
    <line x1="840" y1="0" x2="840" y2="500" />
    <line x1="1000" y1="0" x2="1000" y2="500" />
    <line x1="1160" y1="0" x2="1160" y2="500" />
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="150" x2="1200" y2="150" />
    <line x1="0" y1="250" x2="1200" y2="250" />
    <line x1="0" y1="350" x2="1200" y2="350" />
    <line x1="0" y1="450" x2="1200" y2="450" />
  </g>

  <!-- ================= LEFT COLUMN: HERO VALUE PROPOSITION ================= -->
  <g transform="translate(48, 38)">
    
    <!-- Status Badge -->
    <g>
      <rect width="288" height="26" rx="13" fill="url(#emeraldPill)" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.4" />
      <circle cx="14" cy="13" r="4" fill="#10B981" class="pulse-dot" />
      <text x="26" y="17" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10.5" font-weight="600" fill="#34D399" letter-spacing="0.6">0-DEPENDENCY AI &amp; AGENT FIREWALL</text>
    </g>

    <!-- Wordmark & Version -->
    <g transform="translate(0, 56)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'SF Pro Display', sans-serif" font-size="40" font-weight="800" fill="#FFFFFF" letter-spacing="-1.2">
        SentinelGate
      </text>
      <rect x="268" y="-28" width="58" height="22" rx="5" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="297" y="-13" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#10B981">v0.5.0</text>
    </g>

    <!-- Subhead Description -->
    <g transform="translate(0, 94)">
      <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14.5" fill="#A1A1AA" font-weight="400">
        In-process OpenAI-compatible gateway with SQLite WAL
      </text>
      <text x="0" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="14.5" fill="#A1A1AA" font-weight="400">
        semantic caching, pre-execution tool firewalls, and secret redaction.
      </text>
    </g>

    <!-- 3 Telemetry Cards -->
    <g transform="translate(0, 150)">
      <!-- Card 1 -->
      <g transform="translate(0, 0)">
        <rect width="148" height="78" rx="8" fill="#111114" stroke="#27272A" stroke-width="1" />
        <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#71717A" text-transform="uppercase" letter-spacing="0.5">Proxy Overhead</text>
        <text x="14" y="52" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#10B981">&lt;0.5ms</text>
        <text x="14" y="68" font-family="-apple-system, sans-serif" font-size="9.5" fill="#52525B">0 network hops (mmap)</text>
      </g>

      <!-- Card 2 -->
      <g transform="translate(160, 0)">
        <rect width="148" height="78" rx="8" fill="#111114" stroke="#27272A" stroke-width="1" />
        <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#71717A" text-transform="uppercase" letter-spacing="0.5">Token Spend</text>
        <text x="14" y="52" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#38BDF8">-68%</text>
        <text x="14" y="68" font-family="-apple-system, sans-serif" font-size="9.5" fill="#52525B">Cache + auto-routing</text>
      </g>

      <!-- Card 3 -->
      <g transform="translate(320, 0)">
        <rect width="148" height="78" rx="8" fill="#111114" stroke="#27272A" stroke-width="1" />
        <text x="14" y="24" font-family="-apple-system, sans-serif" font-size="10" font-weight="600" fill="#71717A" text-transform="uppercase" letter-spacing="0.5">Dependencies</text>
        <text x="14" y="52" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="700" fill="#F59E0B">0 Daemons</text>
        <text x="14" y="68" font-family="-apple-system, sans-serif" font-size="9.5" fill="#52525B">Zero Redis / Postgres</text>
      </g>
    </g>

    <!-- Architecture Tech Stack Pills -->
    <g transform="translate(0, 252)">
      <rect x="0" y="0" width="84" height="22" rx="4" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="42" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#D4D4D8">SQLite WAL</text>

      <rect x="92" y="0" width="112" height="22" rx="4" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="148" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#D4D4D8">FastEmbed ONNX</text>

      <rect x="212" y="0" width="68" height="22" rx="4" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="246" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#D4D4D8">FastAPI</text>

      <rect x="288" y="0" width="80" height="22" rx="4" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="328" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#D4D4D8">W3C OTLP</text>

      <rect x="376" y="0" width="92" height="22" rx="4" fill="#18181B" stroke="#27272A" stroke-width="1" />
      <text x="422" y="15" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10" fill="#D4D4D8">Python 3.11+</text>
    </g>

    <!-- Quick CTA hint -->
    <g transform="translate(0, 304)">
      <text x="0" y="0" font-family="'JetBrains Mono', monospace" font-size="11.5" fill="#71717A">
        <tspan fill="#10B981" font-weight="600">$</tspan> pip install sentinelgate <tspan fill="#52525B">&amp;&amp;</tspan> sentinelgate --demo
      </text>
    </g>

  </g>

  <!-- ================= RIGHT COLUMN: ANIMATED TELEMETRY TERMINAL ================= -->
  <g transform="translate(570, 38)">
    
    <!-- Window Frame -->
    <rect width="582" height="424" rx="10" fill="url(#panelGradDark)" stroke="url(#borderGradDark)" stroke-width="1.2" />

    <!-- Terminal Header Bar -->
    <rect width="582" height="34" rx="10" fill="#16161A" />
    <rect y="24" width="582" height="10" fill="#16161A" />
    <line x1="0" y1="34" x2="582" y2="34" stroke="#27272A" stroke-width="1" />

    <!-- Window Dots -->
    <circle cx="18" cy="17" r="4.5" fill="#EF4444" opacity="0.8" />
    <circle cx="32" cy="17" r="4.5" fill="#F59E0B" opacity="0.8" />
    <circle cx="46" cy="17" r="4.5" fill="#10B981" opacity="0.8" />

    <text x="291" y="21" text-anchor="middle" font-family="'JetBrains Mono', monospace" font-size="10.5" fill="#71717A">
      sentinelgate-runtime · port 8000 · operational HUD
    </text>

    <!-- Live Telemetry Stream Inside Terminal -->
    <g transform="translate(20, 56)" font-family="'JetBrains Mono', monospace" font-size="11">
      
      <!-- Static Engine Ready Line -->
      <g transform="translate(0, 0)">
        <text x="0" y="0" fill="#52525B">[0.00ms]</text>
        <text x="64" y="0" fill="#10B981" font-weight="600">ENGINE READY</text>
        <text x="160" y="0" fill="#A1A1AA">SQLite WAL mode initialized (mmap: 256MB)</text>
      </g>

      <g transform="translate(0, 20)">
        <text x="0" y="0" fill="#52525B">[0.12ms]</text>
        <text x="64" y="0" fill="#38BDF8" font-weight="600">ROUTER LOADED</text>
        <text x="160" y="0" fill="#A1A1AA">FastEmbed ONNX (BAAI/bge-small-en-v1.5) CPU</text>
      </g>

      <line x1="0" y1="32" x2="542" y2="32" stroke="#222226" stroke-width="1" stroke-dasharray="3 3" />

      <!-- Animated Event 1: Secret Redaction in Flight -->
      <g transform="translate(0, 52)" class="anim-line-1">
        <rect x="-6" y="-12" width="554" height="48" rx="6" fill="#141122" stroke="#8B5CF6" stroke-width="0.8" stroke-opacity="0.3" />
        <text x="4" y="4" fill="#A78BFA" font-weight="700">[REDACT]</text>
        <text x="76" y="4" fill="#E4E4E7">Outbound prompt scanned in 0.08ms</text>
        <text x="4" y="24" fill="#71717A">Scrubbed: <tspan fill="#F87171">sk-proj-9a88...71f</tspan> &rarr; <tspan fill="#34D399">__SG_SECRET_1__</tspan> (restored inbound)</text>
      </g>

      <!-- Animated Event 2: Local FastEmbed Cache Hit -->
      <g transform="translate(0, 116)" class="anim-line-2">
        <rect x="-6" y="-12" width="554" height="48" rx="6" fill="#0D1F17" stroke="#10B981" stroke-width="0.8" stroke-opacity="0.4" />
        <text x="4" y="4" fill="#34D399" font-weight="700">[CACHE HIT]</text>
        <text x="88" y="4" fill="#E4E4E7">Cosine Match: <tspan fill="#10B981" font-weight="700">0.9412</tspan> &middot; <tspan fill="#38BDF8">FastEmbed CPU</tspan></text>
        <text x="4" y="24" fill="#71717A">Latency: <tspan fill="#34D399" font-weight="700">1.14ms</tspan> &middot; Upstream Egress Cost: <tspan fill="#34D399" font-weight="700">$0.000000</tspan></text>
      </g>

      <!-- Animated Event 3: Pre-Execution Agent Tool Firewall Block -->
      <g transform="translate(0, 180)" class="anim-line-3">
        <rect x="-6" y="-12" width="554" height="60" rx="6" fill="#241113" stroke="#EF4444" stroke-width="0.8" stroke-opacity="0.4" />
        <text x="4" y="4" fill="#F87171" font-weight="700">[BLOCKED]</text>
        <text x="78" y="4" fill="#FCA5A5">Pre-Execution Agent Tool Firewall (0.18ms)</text>
        <text x="4" y="24" fill="#EF4444">Threat: DESTRUCTIVE_SHELL &middot; bash(command="rm -rf /")</text>
        <text x="4" y="40" fill="#71717A">Action: Synthetic OpenAI Refusal &middot; Agent safely self-corrects</text>
      </g>

      <!-- Animated Event 4: Upstream Outage Failover & OTLP Trace -->
      <g transform="translate(0, 258)" class="anim-line-4">
        <rect x="-6" y="-12" width="554" height="48" rx="6" fill="#1C180E" stroke="#F59E0B" stroke-width="0.8" stroke-opacity="0.4" />
        <text x="4" y="4" fill="#FBBF24" font-weight="700">[FAILOVER]</text>
        <text x="88" y="4" fill="#FDE68A">Primary HTTP 429 &rarr; Secondary Groq (0 dropped reqs)</text>
        <text x="4" y="24" fill="#71717A">Trace: <tspan fill="#D4D4D8">00-7c98b2-a4f-01</tspan> &middot; OTLP JSON Flushed to Queue</text>
      </g>

      <!-- Bottom Status Line with blinking cursor -->
      <g transform="translate(0, 332)">
        <text x="0" y="0" fill="#52525B">$</text>
        <text x="14" y="0" fill="#D4D4D8">sentinelgate metrics --live</text>
        <rect x="222" y="-10" width="7" height="13" fill="#10B981" class="cursor" />
      </g>

    </g>

  </g>

</svg>
