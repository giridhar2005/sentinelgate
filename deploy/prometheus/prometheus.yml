global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "sentinelgate"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["host.docker.internal:8000", "localhost:8000"]
        labels:
          environment: "production"
          service: "sentinelgate-ai-gateway"
