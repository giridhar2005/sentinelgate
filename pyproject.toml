[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelgate"
version = "0.5.0"
description = "Zero-bloat, OpenAI-compatible LLM Gateway with semantic caching, PII guardrails, and shadow evals."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.6.0",
    "pyyaml>=6.0",
    "numpy>=1.26.0",
    "fastembed>=0.2.0",
    "pytest>=8.0.0",
    "respx>=0.21.0",
    "ruff>=0.3.0",
    "pytest-asyncio>=1.2.0",
]

[project.scripts]
sentinelgate = "sentinelgate.cli:main"

[tool.setuptools.packages.find]
include = ["app*", "sentinelgate*"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501", "E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = [
    "ignore::urllib3.exceptions.NotOpenSSLWarning",
    "ignore::DeprecationWarning",
]
