name: Feature Request
description: Propose an architecture improvement, new provider adapter, or gateway feature
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Please ensure proposed features respect SentinelGate's **strict zero-bloat constraint**: in-process Python, SQLite WAL, async httpx, and fastembed only. No external services (Redis, Celery, Postgres).

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a specific operational problem or provider limitation?
      placeholder: "I spend excessive tokens when using provider X because..."
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution & Architectural Design
      description: Describe the design, changes to the request lifecycle, or new configuration parameters.
      placeholder: "Add support for provider X by adding an async httpx adapter in app/services/..."
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you considered.
    validations:
      required: false

  - type: checkboxes
    id: constraints
    attributes:
      label: Architectural Compliance Checklist
      options:
        - label: "This feature introduces zero external infrastructure dependencies (no Redis, Celery, Postgres, node_modules)."
          required: true
        - label: "This feature maintains sub-millisecond pre-flight critical path performance."
          required: true
        - label: "This feature maintains drop-in OpenAI API compatibility."
          required: true
