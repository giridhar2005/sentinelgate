name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Type Check (Ruff & Mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.11

      - name: Install Dependencies
        run: |
          uv sync
          uv pip install -e . types-PyYAML mypy

      - name: Run Ruff Lint Checks
        run: uv run ruff check .

      - name: Run Mypy Type Check
        run: uv run mypy app sentinelgate

  test:
    name: Test Suite & Benchmarks (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install Dependencies & CLI Package
        run: |
          uv sync
          uv pip install -e .

      - name: Verify CLI Entrypoint
        run: |
          uv run sentinelgate --help
          uv run python -m sentinelgate --help

      - name: Run Pytest Suite with Coverage
        run: uv run pytest -v --cov=app --cov=sentinelgate

      - name: Verify Gateway Benchmark Execution
        run: uv run python benchmarks/bench.py --output benchmarks/results.json

      - name: Verify Speculative Hedging Benchmark Execution
        run: uv run python benchmarks/bench_hedging.py --output benchmarks/hedging_results.json
